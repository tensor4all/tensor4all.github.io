<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 336" font-family="Helvetica, Arial, sans-serif" role="img">
<title>How one change reaches main</title>
<style>
.h{font-size:16px;font-weight:bold;fill:#1f2328}
.s{font-size:13.5px;fill:#4a515c}
.ct{font-size:13.5px;fill:#1f2328}
.tag{font-size:12.5px;font-weight:bold;fill:#2e8a57}
.lvl{font-size:12px;font-weight:bold;letter-spacing:1px}
.num{font-size:13px;font-weight:bold;fill:#fff}
.lg{font-size:13px;fill:#4a515c}
.lp{font-size:13px;fill:#6a4fb3}
.lr{font-size:13px;fill:#c0392b}
.mono{font-family:Menlo,Consolas,monospace;font-size:13px;fill:#1f2328}
</style>
<rect width="1000" height="336" fill="#ffffff"/>
<rect x="16" y="40" width="152" height="150" rx="8" fill="#fdf3e1" stroke="#c08a2e" stroke-width="1.6"/>
<circle cx="36" cy="62" r="11" fill="#c08a2e"/><text class="num" x="36" y="66.5" text-anchor="middle">1</text>
<text class="h" x="52" y="67">Issue</text>
<text class="s" x="28" y="96">from a human, an</text>
<text class="s" x="28" y="114">audit bot, or a</text>
<text class="s" x="28" y="132">benchmark</text>
<text class="s" x="28" y="150">regression; assigned</text>
<text class="s" x="28" y="168">when work starts</text>
<path d="M169.0,115.0 L165.0,115.0" stroke="#5b6270" stroke-width="3.4" fill="none" stroke-linejoin="round"/>
<polygon points="181.0,115.0 165.0,123.0 165.0,107.0" fill="#5b6270"/>
<rect x="182" y="40" width="152" height="150" rx="8" fill="#fff" stroke="#c9d0de" stroke-width="1.6"/>
<circle cx="202" cy="62" r="11" fill="#6a4fb3"/><text class="num" x="202" y="66.5" text-anchor="middle">2</text>
<text class="h" x="218" y="67">Phase plan</text>
<text class="s" x="194" y="96">super agent splits</text>
<text class="s" x="194" y="114">the work; writes</text>
<text class="s" x="194" y="132">completion conditions:</text>
<text class="s" x="194" y="150">which gates go green,</text>
<text class="s" x="194" y="168">where to stop</text>
<path d="M335.0,115.0 L331.0,115.0" stroke="#5b6270" stroke-width="3.4" fill="none" stroke-linejoin="round"/>
<polygon points="347.0,115.0 331.0,123.0 331.0,107.0" fill="#5b6270"/>
<rect x="348" y="40" width="152" height="150" rx="8" fill="#fff" stroke="#c9d0de" stroke-width="1.6"/>
<circle cx="368" cy="62" r="11" fill="#6a4fb3"/><text class="num" x="368" y="66.5" text-anchor="middle">3</text>
<text class="h" x="384" y="67">Worker</text>
<text class="s" x="360" y="96">implements, runs</text>
<text class="s" x="360" y="114">local tests and gates;</text>
<text class="s" x="360" y="132">design questions are</text>
<text class="s" x="360" y="150">answered from the</text>
<text class="s" x="360" y="168">decision profile</text>
<path d="M501.0,115.0 L497.0,115.0" stroke="#5b6270" stroke-width="3.4" fill="none" stroke-linejoin="round"/>
<polygon points="513.0,115.0 497.0,123.0 497.0,107.0" fill="#5b6270"/>
<rect x="514" y="40" width="152" height="150" rx="8" fill="#fff" stroke="#c9d0de" stroke-width="1.6"/>
<circle cx="534" cy="62" r="11" fill="#6a4fb3"/><text class="num" x="534" y="66.5" text-anchor="middle">4</text>
<text class="h" x="550" y="67">Review</text>
<text class="s" x="526" y="96">independent review</text>
<text class="s" x="526" y="114">by another vendor's</text>
<text class="s" x="526" y="132">model; then one</text>
<text class="s" x="526" y="150">finished pull</text>
<text class="s" x="526" y="168">request</text>
<path d="M667.0,115.0 L663.0,115.0" stroke="#5b6270" stroke-width="3.4" fill="none" stroke-linejoin="round"/>
<polygon points="679.0,115.0 663.0,123.0 663.0,107.0" fill="#5b6270"/>
<rect x="680" y="40" width="152" height="150" rx="8" fill="#eef8f1" stroke="#2e8a57" stroke-width="1.6"/>
<circle cx="700" cy="62" r="11" fill="#2e8a57"/><text class="num" x="700" y="66.5" text-anchor="middle">5</text>
<text class="h" x="716" y="67">CI gates</text>
<text class="s" x="692" y="96">clippy, coverage,</text>
<text class="s" x="692" y="114">doc examples, parity,</text>
<text class="s" x="692" y="132">overhead bench,</text>
<text class="s" x="692" y="150">rule review;</text>
<text class="s" x="692" y="168">no LLM in the gate</text>
<path d="M833.0,115.0 L829.0,115.0" stroke="#5b6270" stroke-width="3.4" fill="none" stroke-linejoin="round"/>
<polygon points="845.0,115.0 829.0,123.0 829.0,107.0" fill="#5b6270"/>
<rect x="846" y="40" width="152" height="150" rx="8" fill="#eef8f1" stroke="#2e8a57" stroke-width="1.6"/>
<circle cx="866" cy="62" r="11" fill="#2e8a57"/><text class="num" x="866" y="66.5" text-anchor="middle">6</text>
<text class="h" x="882" y="67">Merge</text>
<text class="s" x="858" y="96">green CI, tests,</text>
<text class="s" x="858" y="114">hot path measured;</text>
<text class="s" x="858" y="132">by the super agent</text>
<text class="s" x="858" y="150">or a scheduled job;</text>
<text class="s" x="858" y="168">a hold: line waits</text>
<path d="M756.0,192.0 L756.0,236.0 L424.0,236.0 L424.0,208.0" stroke="#c0392b" stroke-width="3.4" fill="none" stroke-linejoin="round"/>
<polygon points="424.0,192.0 432.0,208.0 416.0,208.0" fill="#c0392b"/>
<text class="lr" x="590.0" y="256" text-anchor="middle">CI fails: the super agent sends it back</text>
<text class="lg" x="16" y="300">Last 30 days (to Nov 4, 2026), eight repositories: about 920 merged pull requests, 570 issues opened, 600 closed.</text>
<text class="lg" x="16" y="320">The maintainer sees only the decisions the decision profile does not cover.</text>
</svg>
